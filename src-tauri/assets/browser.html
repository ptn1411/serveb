<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>File Browser</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --border: #1e1e2e;
      --accent: #7c6af7;
      --accent2: #e879f9;
      --text: #e2e2f0;
      --muted: #6b6b8a;
      --hover: #16161f;
      --glow: rgba(124, 106, 247, 0.15);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      min-height: 100vh;
      padding: 0;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.4;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
      padding: 48px 24px 80px;
      position: relative;
      z-index: 1;
    }

    header { margin-bottom: 48px; }

    .breadcrumb {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px 8px;
    }
    .breadcrumb a { display: inline-flex; align-items: center; gap: 6px; }

    .breadcrumb span { color: var(--accent); }
    .breadcrumb a { color: var(--muted); text-decoration: none; cursor: pointer; transition: color 0.15s; }
    .breadcrumb a:hover { color: var(--accent); }
    .breadcrumb .bc-current { color: var(--text); }
    .breadcrumb .bc-sep { color: var(--accent); margin: 0 2px; }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(28px, 5vw, 42px);
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1;
      background: linear-gradient(135deg, var(--text) 0%, var(--accent) 60%, var(--accent2) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
    }

    .subtitle { font-size: 12px; color: var(--muted); letter-spacing: 0.05em; }

    .stats {
      display: flex; gap: 24px; margin-bottom: 32px; padding: 14px 20px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      font-size: 11px; color: var(--muted); letter-spacing: 0.08em;
    }
    .stats strong { color: var(--accent); font-weight: 700; }

    .toolbar { display: flex; gap: 10px; margin-bottom: 20px; align-items: center; }
    .search-wrap { flex: 1; position: relative; }
    .search-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--muted); }

    input[type="search"] {
      width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
      padding: 10px 12px 10px 36px; color: var(--text); font-family: 'JetBrains Mono', monospace;
      font-size: 12px; outline: none; transition: border-color 0.2s;
    }
    input[type="search"]:focus { border-color: var(--accent); }
    input[type="search"]::placeholder { color: var(--muted); }

    .filter-btns { display: flex; gap: 6px; flex-wrap: wrap; }
    .filter-btn {
      padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--surface); color: var(--muted); font-family: 'JetBrains Mono', monospace;
      font-size: 11px; cursor: pointer; transition: all 0.15s; letter-spacing: 0.05em;
    }
    .filter-btn:hover { border-color: var(--accent); color: var(--text); }
    .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    .file-list { display: flex; flex-direction: column; gap: 6px; }

    .file-item {
      display: flex; align-items: center; gap: 16px; padding: 14px 18px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      text-decoration: none; color: var(--text); transition: all 0.18s ease;
      cursor: pointer; position: relative; overflow: hidden; animation: slideIn 0.3s ease both;
    }
    .file-item::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
      background: var(--accent); opacity: 0; transition: opacity 0.18s;
    }
    .file-item:hover { border-color: var(--accent); background: var(--hover); transform: translateX(3px); box-shadow: 0 0 24px var(--glow); }
    .file-item:hover::before { opacity: 1; }

    .file-item.is-folder { cursor: pointer; border-left: 3px solid transparent; }
    .file-item.is-folder:hover { border-left-color: #f59e0b; }
    .file-item.is-folder .folder-arrow { color: var(--muted); transition: transform 0.2s, color 0.2s; }
    .file-item.is-folder:hover .folder-arrow { color: #fbbf24; transform: translateX(4px); }

    @keyframes slideIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .file-icon { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
    .file-meta { flex: 1; min-width: 0; }
    .file-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 3px; letter-spacing: 0.02em; }
    .file-info { font-size: 10px; color: var(--muted); letter-spacing: 0.06em; display: flex; gap: 12px; }
    .file-ext { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 9px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }

    .dl-btn {
      width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border);
      background: transparent; color: var(--muted); display: flex; align-items: center;
      justify-content: center; cursor: pointer; transition: all 0.15s; flex-shrink: 0; text-decoration: none;
      font: inherit; padding: 0;
    }
    .dl-btn:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
    .dl-btn svg { width: 14px; height: 14px; }

    .back-btn {
      display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px;
      margin-bottom: 16px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--surface); color: var(--muted); font-family: 'JetBrains Mono', monospace;
      font-size: 11px; cursor: pointer; transition: all 0.15s; letter-spacing: 0.05em;
    }
    .back-btn:hover { border-color: var(--accent); color: var(--text); background: var(--hover); }
    .back-btn svg { width: 14px; height: 14px; }

    .state-msg { text-align: center; padding: 64px 24px; color: var(--muted); font-size: 12px; letter-spacing: 0.08em; }
    .state-msg .icon { font-size: 40px; margin-bottom: 16px; }

    .loader { display: flex; justify-content: center; gap: 6px; padding: 64px; }
    .loader span { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
    .loader span:nth-child(2) { animation-delay: 0.2s; }
    .loader span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse { 0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); } 40% { opacity: 1; transform: scale(1); } }

    .ext-pdf { background: #ff443322; color: #ff6655; }
    .ext-zip,.ext-rar,.ext-7z { background: #f59e0b22; color: #f59e0b; }
    .ext-mp4,.ext-mkv,.ext-avi,.ext-mov { background: #8b5cf622; color: #a78bfa; }
    .ext-mp3,.ext-wav,.ext-flac { background: #ec489922; color: #f472b6; }
    .ext-jpg,.ext-jpeg,.ext-png,.ext-gif,.ext-webp,.ext-svg { background: #10b98122; color: #34d399; }
    .ext-js,.ext-ts,.ext-jsx,.ext-tsx { background: #fbbf2422; color: #fcd34d; }
    .ext-html,.ext-css { background: #f9731622; color: #fb923c; }
    .ext-json,.ext-xml,.ext-yaml,.ext-yml { background: #06b6d422; color: #22d3ee; }
    .ext-md,.ext-txt { background: #64748b22; color: #94a3b8; }
    .ext-exe,.ext-dmg,.ext-deb,.ext-pkg { background: #ef444422; color: #f87171; }
    .ext-default { background: #374151; color: #9ca3af; }

    footer { text-align: center; margin-top: 48px; font-size: 10px; color: var(--muted); letter-spacing: 0.1em; opacity: 0.5; }

    /* ---- Upload ---- */
    .toolbar { flex-wrap: wrap; }
    .upload-btn {
      display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
      font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; cursor: pointer;
      color: #fff; border: none; border-radius: 8px; padding: 10px 16px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow: 0 6px 18px var(--glow);
    }
    .upload-btn:hover { filter: brightness(1.1); }
    .upload-btn svg { width: 15px; height: 15px; }

    #dropOverlay {
      position: fixed; inset: 0; z-index: 999; display: none;
      background: rgba(10,10,15,.85); backdrop-filter: blur(4px);
      align-items: center; justify-content: center; text-align: center;
      box-shadow: inset 0 0 0 3px var(--accent);
    }
    #dropOverlay.show { display: flex; }
    #dropOverlay .big { font-size: 54px; }
    #dropOverlay .txt { margin-top: 14px; font-size: 17px; font-weight: 700; color: var(--text); }
    #dropOverlay .sub { margin-top: 6px; font-size: 12px; color: var(--muted); }

    #uploadPanel {
      position: fixed; right: 20px; bottom: 20px; z-index: 1000;
      width: 340px; max-width: calc(100vw - 40px);
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
      box-shadow: 0 20px 50px rgba(0,0,0,.55); display: none; overflow: hidden;
    }
    #uploadPanel.show { display: block; }
    .up-head {
      display: flex; align-items: center; gap: 8px; padding: 12px 14px;
      border-bottom: 1px solid var(--border); font-size: 12px; font-weight: 700;
    }
    .up-head .spd { margin-left: auto; font-weight: 500; color: var(--accent); font-size: 11px; font-variant-numeric: tabular-nums; }
    .up-head .close { cursor: pointer; color: var(--muted); font-size: 15px; line-height: 1; padding-left: 4px; }
    .up-head .close:hover { color: var(--text); }
    .up-list { max-height: 260px; overflow-y: auto; padding: 8px 10px; display: flex; flex-direction: column; gap: 9px; }
    .up-item .row1 { display: flex; gap: 8px; align-items: center; font-size: 11px; }
    .up-item .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .up-item .pct { color: var(--muted); font-variant-numeric: tabular-nums; }
    .up-item .bar { height: 5px; margin-top: 5px; background: var(--hover); border-radius: 3px; overflow: hidden; }
    .up-item .bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width .12s linear; }
    .up-item.done .bar > i { background: #34d399; }
    .up-item.err .nm { color: #f87171; }
    .up-item.err .bar > i { background: #f87171; }

    /* Mobile: give search its own full-width row so it isn't squeezed by the buttons */
    @media (max-width: 620px) {
      .toolbar { gap: 8px; }
      .search-wrap { flex: 1 1 100%; order: 1; }
      .filter-btns { order: 3; flex: 1 1 100%; }
      .upload-btn { order: 2; width: 100%; justify-content: center; }
      .filter-btn { flex: 1 1 auto; text-align: center; }
    }

    /* ---- Media viewer (image / video / audio preview) ---- */
    #viewer {
      position: fixed; inset: 0; z-index: 2000; display: none; flex-direction: column;
      background: rgba(6,6,10,.94); backdrop-filter: blur(6px);
    }
    #viewer.show { display: flex; }
    .v-head { display: flex; align-items: center; gap: 12px; padding: 14px 18px; color: var(--text); }
    .v-name { flex: 1; min-width: 0; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .v-btn {
      background: var(--surface); border: 1px solid var(--border); color: var(--text);
      border-radius: 9px; padding: 8px 13px; font-size: 12px; cursor: pointer;
      font-family: 'JetBrains Mono', monospace; text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
    }
    .v-btn:hover { border-color: var(--accent); color: #fff; }
    .v-body { flex: 1; display: flex; align-items: center; justify-content: center; padding: 0 16px 20px; overflow: hidden; position: relative; }
    #vStage { max-width: 100%; max-height: 100%; display: flex; align-items: center; justify-content: center; }
    #vStage img, #vStage video { max-width: 100%; max-height: 82vh; border-radius: 10px; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
    #vStage audio { width: min(560px, 88vw); }
    .v-err { color: var(--muted); font-size: 13px; text-align: center; line-height: 1.8; }
    .v-nav {
      position: absolute; top: 50%; transform: translateY(-50%); z-index: 2;
      background: rgba(20,20,30,.7); border: 1px solid var(--border); color: #fff;
      width: 46px; height: 46px; border-radius: 50%; font-size: 24px; cursor: pointer;
      display: grid; place-items: center; transition: .15s;
    }
    .v-nav:hover { background: var(--accent); border-color: var(--accent); }
    .v-prev { left: 12px; } .v-next { right: 12px; }
    .file-item.media { cursor: zoom-in; }

    /* ---- Header actions + public-folder switcher ---- */
    .head-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
    .chip-btn {
      font-family: 'JetBrains Mono', monospace; font-size: 11px; cursor: pointer;
      padding: 8px 13px; border-radius: 999px; border: 1px solid var(--border);
      background: var(--surface); color: var(--text); transition: .15s;
    }
    .chip-btn:hover { border-color: var(--accent); }
    .roots-label { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: -24px 0 8px; }
    .roots {
      display: flex; gap: 8px; overflow-x: auto; margin-bottom: 24px; padding-bottom: 6px;
      -webkit-overflow-scrolling: touch; scrollbar-width: thin;
    }
    .root-chip {
      flex: none; display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
      font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text);
      padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface);
      transition: .15s; max-width: 240px;
    }
    .root-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .root-chip small { font-size: 9px; color: var(--muted); border: 1px solid var(--border); border-radius: 5px; padding: 1px 5px; }
    .root-chip:hover { border-color: var(--accent); }
    .root-chip.active { border-color: var(--accent); background: rgba(124,106,247,.16); box-shadow: 0 0 18px var(--glow); }

    /* ---- Modals (share / links) ---- */
    .modal {
      position: fixed; inset: 0; z-index: 1500; display: none; align-items: center; justify-content: center;
      background: rgba(6,6,10,.8); backdrop-filter: blur(4px); padding: 16px;
    }
    .modal.show { display: flex; }
    .m-card {
      width: 100%; max-width: 420px; max-height: calc(100vh - 32px); overflow-y: auto;
      background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
      padding: 18px; box-shadow: 0 30px 70px rgba(0,0,0,.6);
    }
    .m-head { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; margin-bottom: 14px; }
    .m-x { margin-left: auto; background: none; border: none; color: var(--muted); font-size: 16px; cursor: pointer; padding: 4px 6px; }
    .m-x:hover { color: var(--text); }
    .m-target {
      display: flex; gap: 8px; align-items: center; font-size: 12px; padding: 10px 12px; border-radius: 10px;
      background: var(--bg); border: 1px solid var(--border); margin-bottom: 14px; word-break: break-all;
    }
    .m-label { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 12px 0 7px; }
    .m-row { display: flex; gap: 8px; align-items: center; }
    .seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .seg button {
      font-family: 'JetBrains Mono', monospace; font-size: 11px; padding: 9px 4px; cursor: pointer;
      border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--muted);
    }
    .seg button.active { border-color: var(--accent); color: #fff; background: rgba(124,106,247,.2); }
    .m-pin, .m-url {
      flex: 1; min-width: 0; font-family: 'JetBrains Mono', monospace; color: var(--text);
      background: var(--bg); border: 1px solid var(--border); border-radius: 9px; padding: 10px 12px; outline: none;
    }
    .m-pin { font-size: 20px; letter-spacing: 10px; text-align: center; }
    .m-pin:disabled { opacity: .35; }
    .m-url { font-size: 13px; color: var(--accent); }
    .m-pin:focus, .m-url:focus { border-color: var(--accent); }
    .m-check { display: flex; gap: 8px; align-items: center; font-size: 11px; color: var(--muted); margin-top: 10px; cursor: pointer; }
    .m-main { width: 100%; justify-content: center; margin-top: 16px; padding: 12px; }
    .m-pinout { margin-top: 12px; font-size: 13px; }
    .m-pinout b { color: var(--accent2); letter-spacing: 4px; font-size: 16px; }
    .m-note { margin-top: 8px; font-size: 10px; color: var(--muted); line-height: 1.6; }
    .v-btn.danger:hover { border-color: #f87171; color: #f87171; }
    .lk-list { display: flex; flex-direction: column; gap: 8px; }
    .lk-item { padding: 11px 12px; border-radius: 10px; background: var(--bg); border: 1px solid var(--border); }
    .lk-item.dead { opacity: .5; }
    .lk-top { display: flex; gap: 8px; align-items: center; font-size: 12px; }
    .lk-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lk-meta { font-size: 10px; color: var(--muted); margin: 6px 0 9px; line-height: 1.6; }
    .lk-acts { display: flex; gap: 6px; flex-wrap: wrap; }
    .lk-acts .v-btn { padding: 6px 10px; font-size: 11px; }

    /* QR codes (share result + QR modal) */
    .m-qr { display: flex; justify-content: center; margin-top: 14px; }
    .m-qr img { width: 200px; height: 200px; border-radius: 12px; background: #fff; padding: 6px; }
    .m-qr:empty { display: none; }

    /* Action sheet: slides up from the bottom on phones */
    .modal.sheet { align-items: flex-end; }
    .modal.sheet .m-card { max-width: 480px; border-radius: 18px 18px 12px 12px; padding: 14px; }
    .as-list { display: flex; flex-direction: column; gap: 6px; }
    .as-btn {
      display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; cursor: pointer;
      font-family: 'JetBrains Mono', monospace; font-size: 14px; color: var(--text);
      padding: 14px; border-radius: 11px; border: 1px solid var(--border); background: var(--bg);
    }
    .as-btn:hover { border-color: var(--accent); }
    .as-btn.danger { color: #f87171; }
    .as-btn.danger:hover { border-color: #f87171; }
    .as-cancel { justify-content: center; margin-top: 10px; color: var(--muted); }
    .newdir-btn { border-radius: 8px; padding: 10px 14px; font-size: 12px; white-space: nowrap; }
    .m-name { font-size: 16px; color: var(--text); width: 100%; }
    @media (max-width: 620px) {
      .newdir-btn { order: 2; width: 100%; }
    }

    .toast {
      position: fixed; left: 50%; bottom: 22px; z-index: 3000; transform: translateX(-50%) translateY(20px);
      background: var(--accent); color: #fff; font-size: 12px; font-weight: 600; padding: 9px 16px;
      border-radius: 999px; opacity: 0; transition: .25s; pointer-events: none; max-width: calc(100vw - 32px);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @media (max-width: 620px) {
      .container { padding: 28px 16px 60px; }
      header { margin-bottom: 32px; }
      .roots-label { margin-top: -12px; }
      .file-item { gap: 10px; padding: 12px 12px; }
      /* iOS zooms into inputs below 16px — keep them at 16px on phones */
      input[type="search"], .m-url { font-size: 16px; }
    }
  </style>
</head>
<body>
<div class="container">
  <header>
    <div class="breadcrumb" id="breadcrumb"></div>
    <h1 id="title">File Browser</h1>
    <p class="subtitle" id="subtitle">// click file to download · click folder to open</p>
    <div class="head-actions" id="headActions">
      <button class="chip-btn" id="zipHere">🗜️ Tải cả thư mục (ZIP)</button>
      <button class="chip-btn" id="shareHere">🔗 Chia sẻ thư mục này</button>
      <button class="chip-btn" id="linksBtn">📋 Link đã tạo</button>
      <button class="chip-btn" id="logoutBtn" style="display:none">⏻ Đăng xuất</button>
    </div>
  </header>

  <div class="roots-label" id="rootsLabel" style="display:none">// thư mục công khai</div>
  <div class="roots" id="roots" style="display:none"></div>

  <div id="backBtn"></div>

  <div class="stats" id="stats"><span>Loading...</span></div>

  <div class="toolbar">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="search" id="search" placeholder="Search files..." oninput="filterFiles()" />
    </div>
    <div class="filter-btns" id="filterBtns"></div>

<div class="toast" id="toast"></div>

<script>
  // ---- Mode: normal browsing, or a temporary share link opened at /s/<token> ----
  const SHARE = (location.pathname.match(/^\/s\/([A-Za-z0-9]+)/) || [])[1] || null;
  const SHARE_BASE = SHARE ? '/s/' + SHARE : '';
  const LOADER = '<div class="loader"><span></span><span></span><span></span></div>';

  let allItems = [], allFiles = [], allDirs = [];
  let activeFilter = 'all';
  let currentPath = '/';
  let currentRoot = 0;          // 0 = main folder, others = public folders from the DB
  let roots = [];               // [{ id, name, perm }]
  // Permission of the folder on screen: 0 view · 1 +upload/new folder · 2 +rename/delete
  const PERM_UPLOAD = 1, PERM_FULL = 2;
  let perm = 0;
  let allowUpload = false;
  let shareInfo = null;         // { name, kind, expires_at } in share mode
  let lastRendered = [];

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const encPath = (p) => p.split('/').map(encodeURIComponent).join('/');

  function listUrl(path) {
    return SHARE
      ? `${SHARE_BASE}/__api/list?path=${encodeURIComponent(path)}`
      : `/__api/list?root=${currentRoot}&path=${encodeURIComponent(path)}`;
  }
  // relPath is relative to the current root, e.g. "/Movies/a.mp4"
  function fileUrl(relPath) {
    return (SHARE ? SHARE_BASE + '/f' : '/__f/' + currentRoot) + encPath(relPath);
  }
  function rootName() {
    if (SHARE) return shareInfo ? shareInfo.name : 'link';
    const r = roots.find((x) => x.id === currentRoot);
    return r ? r.name : 'root';
  }

  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._t);
    t._t = setTimeout(() => t.classList.remove('show'), 2000);
  }

  // Clipboard API needs HTTPS; LAN pages are plain http, so fall back to execCommand.
  async function copyText(text) {
    try {
      if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; }
    } catch (e) {}
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;font-size:16px';
    document.body.appendChild(ta);
    ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    ta.remove();
    return ok;
  }

  const fmtDate = (ts) => new Date(ts * 1000).toLocaleString('vi-VN',
    { hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit', year: 'numeric' });
  function fmtLeft(ts) {
    const s = ts - Date.now() / 1000;
    if (s <= 0) return '0 phút';
    if (s < 3600) return Math.max(1, Math.round(s / 60)) + ' phút';
    if (s < 86400) return Math.round(s / 3600) + ' giờ';
    return Math.round(s / 86400) + ' ngày';
  }

  const iconMap = {
    pdf: '📄', zip: '🗜️', rar: '🗜️', '7z': '🗜️',
    mp4: '🎬', mkv: '🎬', avi: '🎬', mov: '🎬', webm: '🎬',
    mp3: '🎵', wav: '🎵', flac: '🎵', ogg: '🎵',
    jpg: '🖼️', jpeg: '🖼️', png: '🖼️', gif: '🖼️', webp: '🖼️', svg: '🖼️',
    js: '⚡', ts: '⚡', jsx: '⚡', tsx: '⚡',
    html: '🌐', css: '🎨',
    json: '📋', xml: '📋', yaml: '📋', yml: '📋',
    md: '📝', txt: '📝',
    exe: '⚙️', dmg: '💿', deb: '📦', pkg: '📦',
    py: '🐍', rb: '💎', go: '🔷', rs: '🦀', java: '☕',
    default: '📁'
  };

  // ---------------- Navigation (state lives in the URL hash so Back works) ----------------
  // Normal mode: #<rootId>:<path>   Share mode: #<path>
  function hashFor(root, path) {
    return '#' + (SHARE ? '' : root + ':') + encPath(path);
  }
  function parseHash() {
    let h = location.hash.slice(1), root = 0, path = '/';
    if (!SHARE) {
      const i = h.indexOf(':');
      if (i > 0) { root = parseInt(h.slice(0, i), 10) || 0; h = h.slice(i + 1); } else h = '';
    }
    try { path = decodeURIComponent(h) || '/'; } catch (e) { path = '/'; }
    if (!path.startsWith('/')) path = '/' + path;
    if (!path.endsWith('/')) path += '/';
    return { root, path };
  }

  function navigateTo(path, root = currentRoot) {
    const h = hashFor(root, path);
    if (location.hash !== h) location.hash = h;
    route();
  }

  function route() {
    const s = parseHash();
    if (!SHARE && !roots.some((r) => r.id === s.root)) { s.root = 0; s.path = '/'; }
    currentRoot = s.root;
    currentPath = s.path;
    activeFilter = 'all';
    $('search').value = '';
    $('fileList').innerHTML = LOADER;
    renderRoots();
    loadFiles(currentPath);
  }

  window.addEventListener('hashchange', () => {
    const s = parseHash();
    if (s.root !== currentRoot || s.path !== currentPath) route();
  });

  function goBack() {
    const parts = currentPath.split('/').filter(Boolean);
    parts.pop();
    navigateTo('/' + (parts.length ? parts.join('/') + '/' : ''));
  }

  // ---------------- Public folders (roots) ----------------
  async function loadRoots() {
    try {
      const res = await fetch('/__api/roots');
      if (res.status === 401) { location.href = '/__login'; return; }
      const data = await res.json();
      roots = data.roots || [];
      $('logoutBtn').style.display = data.auth ? '' : 'none';
    } catch (e) {
      roots = [{ id: 0, name: 'root', perm: 1 }];
    }
  }

  function renderRoots() {
    const box = $('roots');
    const show = !SHARE && roots.length > 1;
    box.style.display = show ? '' : 'none';
    $('rootsLabel').style.display = show ? '' : 'none';
    if (!show) return;
    box.innerHTML = roots.map((r) =>
      `<button class="root-chip${r.id === currentRoot ? ' active' : ''}" data-root="${r.id}">` +
        `${r.id === 0 ? '🏠' : '📁'} <span>${esc(r.name)}</span>` +
        `${r.perm > 0 ? '' : '<small>chỉ xem</small>'}` +
      `</button>`).join('');
    const act = box.querySelector('.active');
    if (act && act.scrollIntoView) act.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  }

  $('roots').addEventListener('click', (e) => {
    const b = e.target.closest('[data-root]');
    if (b) navigateTo('/', parseInt(b.dataset.root, 10));
  });

  // Pick up folders the PC added/removed while this tab was in the background.
  document.addEventListener('visibilitychange', async () => {
    if (document.hidden || SHARE) return;
    await loadRoots();
    if (!roots.some((r) => r.id === currentRoot)) navigateTo('/', 0); else renderRoots();
  });

  // ---------------- Listing ----------------
  const HOME_SVG = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>';

  function updateBreadcrumb() {
    const bc = $('breadcrumb');
    const parts = currentPath.split('/').filter(Boolean);
    const label = esc(rootName());
    let html = parts.length
      ? `<a data-nav="/">${HOME_SVG} ${label}</a>`
      : `${HOME_SVG} <span class="bc-current">${label}</span>`;
    parts.forEach((part, i) => {
      const to = '/' + parts.slice(0, i + 1).join('/') + '/';
      html += ' <span class="bc-sep">/</span> ' + (i === parts.length - 1
        ? `<span class="bc-current">${esc(part)}</span>`
        : `<a data-nav="${esc(to)}">${esc(part)}</a>`);
    });
    bc.innerHTML = html;

    $('backBtn').innerHTML = currentPath !== '/'
      ? `<button class="back-btn" onclick="goBack()">
           <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
           back
         </button>`
      : '';
  }

  $('breadcrumb').addEventListener('click', (e) => {
    const a = e.target.closest('[data-nav]');
    if (a) navigateTo(a.dataset.nav);
  });

  async function loadFiles(path) {
    path = path || currentPath;
    const reqRoot = currentRoot;
    try {
      const res = await fetch(listUrl(path));
      if (res.status === 401) { if (SHARE) location.reload(); else location.href = '/__login'; return; }
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      if (reqRoot !== currentRoot || path !== currentPath) return; // user already moved on

      // API returns { items: [{name, isDir, size}], perm } — already sorted
      const items = (data.items || []).filter(f => f.name !== '..' && !f.name.startsWith('.'));

      allDirs = items.filter(f => f.isDir);
      allFiles = items.filter(f => !f.isDir);
      allItems = [...allDirs, ...allFiles];
      perm = SHARE ? 0 : (data.perm || 0);
      allowUpload = perm >= PERM_UPLOAD;
      $('uploadBtn').style.display = allowUpload ? '' : 'none';
      $('mkdirBtn').style.display = allowUpload ? '' : 'none';

      updateBreadcrumb();
      buildFilterButtons();
      renderItems(allItems);
      updateStats(allFiles, allDirs);
    } catch (err) {
      $('fileList').innerHTML = `
        <div class="state-msg">
          <div class="icon">⚠️</div>
          <p>Could not read directory.</p>
          <p style="margin-top:8px;font-size:10px;opacity:0.6">${esc(err.message)}</p>
        </div>`;
      $('stats').innerHTML = '<span>Error</span>';
      updateBreadcrumb();
    }
  }

  function getExt(name) {
    const parts = name.split('.');
    return parts.length > 1 ? parts.pop().toLowerCase() : '';
  }

  function formatSize(bytes) {
    if (typeof bytes !== 'number' || bytes === 0) return '—';
    const units = ['B', 'KB', 'MB', 'GB', 'TB'];
    let i = 0, v = bytes;
    while (v >= 1024 && i < 4) { v /= 1024; i++; }
    return `${v.toFixed(i > 0 ? 1 : 0)} ${units[i]}`;
  }

  function buildFilterButtons() {
    const exts = [...new Set(allFiles.map(f => getExt(f.name)).filter(Boolean))];
    const container = $('filterBtns');
    container.innerHTML = '';

    const allBtn = document.createElement('button');
    allBtn.className = 'filter-btn active';
    allBtn.textContent = 'all';
    allBtn.dataset.ext = 'all';
    allBtn.onclick = () => setFilter('all');
    container.appendChild(allBtn);

    if (allDirs.length > 0) {
      const folderBtn = document.createElement('button');
      folderBtn.className = 'filter-btn';
      folderBtn.textContent = '📂 folders';
      folderBtn.dataset.ext = 'folder';
      folderBtn.onclick = () => setFilter('folder');
      container.appendChild(folderBtn);
    }

    exts.slice(0, 5).forEach(ext => {
      const btn = document.createElement('button');
      btn.className = 'filter-btn';
      btn.textContent = ext;
      btn.dataset.ext = ext;
      btn.onclick = () => setFilter(ext);
      container.appendChild(btn);
    });
  }

  function setFilter(ext) {
    activeFilter = ext;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.ext === ext));
    filterFiles();
  }

  function filterFiles() {
    const q = $('search').value.toLowerCase();
    let filtered;
    if (activeFilter === 'folder') {
      filtered = allDirs.filter(f => f.name.toLowerCase().includes(q));
    } else if (activeFilter === 'all') {
      filtered = allItems.filter(f => f.name.toLowerCase().includes(q));
    } else {
      filtered = allFiles.filter(f => f.name.toLowerCase().includes(q) && getExt(f.name) === activeFilter);
    }
    renderItems(filtered);
  }

  const MORE_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>';

  function renderItems(items) {
    lastRendered = items;
    const container = $('fileList');
    if (items.length === 0) {
      container.innerHTML = '<div class="state-msg"><div class="icon">🔍</div><p>No files found.</p></div>';
      return;
    }

    const shareBtn = SHARE ? '' : `<button class="dl-btn" data-act="more" title="Chia sẻ, đổi tên, xóa…">${MORE_SVG}</button>`;
    container.innerHTML = items.map((f, i) => {
      const name = esc(f.name);
      if (f.isDir) {
        return `
          <div class="file-item is-folder" data-i="${i}" style="animation-delay:${i * 0.04}s">
            <span class="file-icon" style="background:#f59e0b18;color:#fbbf24;font-size:18px">📂</span>
            <div class="file-meta">
              <div class="file-name">${name}</div>
              <div class="file-info"><span style="color:#fbbf24">folder</span></div>
            </div>
            ${shareBtn}
            <span class="folder-arrow">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
            </span>
          </div>`;
      }
      const ext = getExt(f.name);
      const icon = iconMap[ext] || iconMap.default;
      const extClass = ext ? `ext-${esc(ext)}` : 'ext-default';
      const isMedia = !!mediaType(ext);
      return `
        <div class="file-item${isMedia ? ' media' : ''}" data-i="${i}" style="animation-delay:${i * 0.04}s">
          <span class="file-icon ${extClass}">${icon}</span>
          <div class="file-meta">
            <div class="file-name">${name}</div>
            <div class="file-info">
              ${ext ? `<span class="file-ext ${extClass}">${esc(ext)}</span>` : ''}
              <span>${formatSize(f.size)}</span>
            </div>
          </div>
          ${shareBtn}
          <a class="dl-btn" data-act="dl" href="${esc(fileUrl(currentPath + f.name))}" download="${name}" title="Download">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
          </a>
        </div>`;
    }).join('');
  }

  $('fileList').addEventListener('click', (e) => {
    const row = e.target.closest('.file-item');
    if (!row) return;
    const f = lastRendered[+row.dataset.i];
    if (!f) return;
    const act = e.target.closest('[data-act]');
    if (act && act.dataset.act === 'dl') return; // let <a download> do its thing
    if (act && act.dataset.act === 'more') { openActions(f); return; }
    if (f.isDir) navigateTo(currentPath + f.name + '/');
    else onFileClick(f);
  });

  // ---------------- Item actions: share / rename / delete / new folder ----------------
  const itemPath = (f) => currentPath + f.name + (f.isDir ? '/' : '');
  let sheetItem = null;

  function openActions(f) {
    sheetItem = f;
    $('asTarget').innerHTML = `<span>${f.isDir ? '📂' : '📄'}</span><span>${esc(f.name)}</span>`;
    const acts = [];
    if (f.isDir) acts.push(['open', '📂', 'Mở thư mục'], ['zip', '🗜️', 'Tải cả thư mục (ZIP)']);
    else acts.push(['view', mediaType(getExt(f.name)) ? '👁️' : '📄', 'Xem / mở'], ['dl', '⬇️', 'Tải về']);
    acts.push(['share', '🔗', 'Tạo link chia sẻ']);
    if (perm >= PERM_FULL) acts.push(['rename', '✏️', 'Đổi tên'], ['delete', '🗑️', 'Chuyển vào Thùng rác', 'danger']);
    $('asList').innerHTML = acts.map(([id, ic, label, cls]) =>
      `<button class="as-btn ${cls || ''}" data-as="${id}"><span>${ic}</span>${label}</button>`).join('');
    openModal('actSheet');
  }

  $('asList').addEventListener('click', async (e) => {
    const b = e.target.closest('[data-as]');
    const f = sheetItem;
    if (!b || !f) return;
    $('actSheet').classList.remove('show');
    switch (b.dataset.as) {
      case 'open': navigateTo(itemPath(f)); break;
      case 'zip': downloadZip(itemPath(f), f.name); break;
      case 'view': onFileClick(f); break;
      case 'dl': {
        const a = document.createElement('a');
        a.href = fileUrl(currentPath + f.name); a.download = f.name;
        document.body.appendChild(a); a.click(); a.remove();
        break;
      }
      case 'share': openShare({ path: itemPath(f), name: f.name, isDir: f.isDir }); break;
      case 'rename': {
        const name = await askName('✏️ Đổi tên', f.name, 'Đổi tên', !f.isDir);
        if (name && name !== f.name) fileOp('rename', { path: itemPath(f), name }, 'Đã đổi tên');
        break;
      }
      case 'delete':
        if (confirm(`Chuyển “${f.name}” vào Thùng rác trên máy tính?` +
                    (f.isDir ? '\n(Cả thư mục và mọi thứ bên trong)' : '') +
                    '\nCó thể khôi phục lại từ Thùng rác.')) {
          fileOp('delete', { path: itemPath(f) }, 'Đã chuyển vào Thùng rác');
        }
        break;
    }
  });

  // The server streams the archive while it reads the files, so the download starts
  // right away (no size shown up front) and even very large folders work.
  function downloadZip(path, name) {
    const url = SHARE
      ? `${SHARE_BASE}/zip?path=${encodeURIComponent(path)}`
      : `/__api/zip?root=${currentRoot}&path=${encodeURIComponent(path)}`;
    const a = document.createElement('a');
    a.href = url;
    a.download = (name || 'thu-muc') + '.zip';
    document.body.appendChild(a); a.click(); a.remove();
    toast('Đang tải ZIP… (không nén, giữ nguyên chất lượng)');
  }
  $('zipHere').onclick = () => {
    const parts = currentPath.split('/').filter(Boolean);
    downloadZip(currentPath, parts.length ? parts[parts.length - 1] : rootName());
  };

  $('mkdirBtn').onclick = async () => {
    const name = await askName('📁 Thư mục mới', '', 'Tạo thư mục', false);
    if (name) fileOp('mkdir', { path: currentPath, name }, 'Đã tạo thư mục');
  };

  async function fileOp(op, body, okMsg) {
    try {
      const res = await fetch('/__api/' + op, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ root: currentRoot, ...body }),
      });
      if (res.status === 401) { location.href = '/__login'; return; }
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'HTTP ' + res.status);
      toast(okMsg);
    } catch (e) {
      toast('Lỗi: ' + e.message);
    }
    loadFiles(currentPath);
  }

  // Small name dialog; resolves to the trimmed name, or null if cancelled.
  let nameResolve = null;
  function askName(title, value, okLabel, selectStem) {
    $('nmTitle').textContent = title;
    $('nmOk').textContent = okLabel;
    $('nmError').textContent = '';
    const input = $('nmInput');
    input.value = value;
    openModal('nameModal');
    setTimeout(() => {
      input.focus();
      // Select the name without its extension, like Explorer does.
      const dot = value.lastIndexOf('.');
      input.setSelectionRange(0, selectStem && dot > 0 ? dot : value.length);
    }, 50);
    return new Promise((resolve) => { nameResolve = resolve; });
  }
  function finishName(v) {
    if (nameResolve) { nameResolve(v); nameResolve = null; }
    $('nameModal').classList.remove('show');
  }
  $('nmForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const v = $('nmInput').value.trim();
    if (!v) { $('nmError').textContent = 'Hãy nhập tên'; return; }
    if (/[<>:"/\\|?*]/.test(v)) { $('nmError').textContent = 'Tên không được chứa < > : " / \\ | ? *'; return; }
    finishName(v);
  });
  // Closing the dialog any other way counts as cancel.
  new MutationObserver(() => {
    if (!$('nameModal').classList.contains('show') && nameResolve) finishName(null);
  }).observe($('nameModal'), { attributes: true, attributeFilter: ['class'] });

  function updateStats(files, dirs) {
    const total = files.length;
    const totalSize = files.reduce((s, f) => s + (f.size || 0), 0);
    const exts = new Set(files.map(f => getExt(f.name)).filter(Boolean));
    const dirCount = dirs.length;
    $('stats').innerHTML = `
      ${dirCount > 0 ? `<span><strong>${dirCount}</strong> folders</span>` : ''}
      <span><strong>${total}</strong> files</span>
      <span><strong>${formatSize(totalSize)}</strong> total</span>
      <span><strong>${exts.size}</strong> types</span>`;
  }

  // ---------------- Media viewer (preview images / video / audio) ----------------
  const MEDIA_EXT = {
    image: ['jpg','jpeg','png','gif','webp','svg','bmp','avif','ico','jfif'],
    video: ['mp4','webm','ogv','mov','m4v','mkv'],
    audio: ['mp3','wav','flac','ogg','m4a','aac','opus'],
  };
  function mediaType(ext) {
    for (const t in MEDIA_EXT) if (MEDIA_EXT[t].includes(ext)) return t;
    return null;
  }

  let viewerList = [], viewerIdx = -1;

  function onFileClick(f) {
    const url = fileUrl(currentPath + f.name);
    if (!mediaType(getExt(f.name))) { window.location.href = url; return; } // non-media: open/download
    // Collect all previewable files currently shown, for prev/next navigation
    viewerList = (lastRendered || [])
      .filter(x => !x.isDir && mediaType(getExt(x.name)))
      .map(x => ({ url: fileUrl(currentPath + x.name), name: x.name, type: mediaType(getExt(x.name)) }));
    viewerIdx = viewerList.findIndex(x => x.name === f.name);
    if (viewerIdx < 0) { viewerList = [{ url, name: f.name, type: mediaType(getExt(f.name)) }]; viewerIdx = 0; }
    showViewer();
  }

  function showViewer() {
    const it = viewerList[viewerIdx];
    if (!it) return;
    const stage = $('vStage');
    $('vName').textContent = it.name;
    const dl = $('vDownload');
    dl.href = it.url; dl.setAttribute('download', it.name);

    const src = esc(it.url);
    if (it.type === 'image') {
      stage.innerHTML = `<img src="${src}" alt="">`;
    } else if (it.type === 'video') {
      stage.innerHTML = `<video src="${src}" controls autoplay playsinline></video>`;
    } else {
      stage.innerHTML = `<audio src="${src}" controls autoplay></audio>`;
    }
    const m = stage.querySelector('img,video,audio');
    if (m) m.onerror = () => {
      stage.innerHTML = '<div class="v-err">Trình duyệt không phát được định dạng này.<br>Bấm <b>⬇ Tải</b> để tải về xem.</div>';
    };

    const multi = viewerList.length > 1;
    $('vPrev').style.display = multi ? 'grid' : 'none';
    $('vNext').style.display = multi ? 'grid' : 'none';
    $('viewer').classList.add('show');
  }

  function closeViewer() {
    $('viewer').classList.remove('show');
    $('vStage').innerHTML = ''; // stop any playback
  }
  function viewerStep(d) {
    if (!viewerList.length) return;
    viewerIdx = (viewerIdx + d + viewerList.length) % viewerList.length;
    showViewer();
  }

  $('vClose').onclick = closeViewer;
  $('vPrev').onclick = () => viewerStep(-1);
  $('vNext').onclick = () => viewerStep(1);
  $('viewer').addEventListener('click', (e) => {
    if (e.target.id === 'viewer' || e.target.id === 'vBody') closeViewer();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') document.querySelectorAll('.modal.show').forEach(m => m.classList.remove('show'));
    if (!$('viewer').classList.contains('show')) return;
    if (e.key === 'Escape') closeViewer();
    else if (e.key === 'ArrowLeft') viewerStep(-1);
    else if (e.key === 'ArrowRight') viewerStep(1);
  });

  // ---------------- Share links ----------------
  function openModal(id) { $(id).classList.add('show'); }
  document.querySelectorAll('.modal').forEach((m) => {
    m.addEventListener('click', (e) => {
      if (e.target === m || e.target.closest('[data-close]')) m.classList.remove('show');
    });
  });

  const randomPin = () => String(crypto.getRandomValues(new Uint32Array(1))[0] % 10000).padStart(4, '0');
  const linkUrl = (l) => location.origin + '/s/' + l.token;
  const qrImg = (text) => `<img alt="QR" src="/__api/qr?text=${encodeURIComponent(text)}">`;
  function showQr(text) {
    $('qrBox').innerHTML = qrImg(text);
    $('qrText').textContent = text;
    openModal('qrModal');
  }

  $('logoutBtn').onclick = async () => {
    if (!confirm('Đăng xuất khỏi thiết bị này?')) return;
    await fetch('/__api/logout', { method: 'POST' }).catch(() => {});
    location.href = '/__login';
  };
  let shareTarget = null; // { path, name, isDir }

  function openShare(target) {
    shareTarget = target;
    $('smTarget').innerHTML = `<span>${target.isDir ? '📂' : '📄'}</span><span>${esc(target.name)}</span>`;
    $('smPin').value = randomPin();
    $('smPin').disabled = false;
    $('smNoPin').checked = false;
    $('smForm').style.display = '';
    $('smResult').style.display = 'none';
    openModal('shareModal');
  }

  $('shareHere').onclick = () => {
    const parts = currentPath.split('/').filter(Boolean);
    openShare({ path: currentPath, name: parts.length ? parts[parts.length - 1] : rootName(), isDir: true });
  };
  $('smHours').addEventListener('click', (e) => {
    const b = e.target.closest('[data-h]');
    if (!b) return;
    $('smHours').querySelectorAll('button').forEach(x => x.classList.toggle('active', x === b));
  });
  $('smRand').onclick = () => { $('smPin').value = randomPin(); };
  $('smPin').addEventListener('input', () => { $('smPin').value = $('smPin').value.replace(/\D/g, '').slice(0, 4); });
  $('smNoPin').onchange = () => { $('smPin').disabled = $('smNoPin').checked; };

  $('smCreate').onclick = async () => {
    const noPin = $('smNoPin').checked;
    const pin = noPin ? null : $('smPin').value.trim();
    if (!noPin && !/^\d{4}$/.test(pin)) { toast('Mật khẩu phải gồm đúng 4 chữ số'); return; }
    const active = $('smHours').querySelector('.active');
    const hours = active ? +active.dataset.h : 24;
    const btn = $('smCreate');
    btn.disabled = true;
    try {
      const res = await fetch('/__api/links', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ root: currentRoot, path: shareTarget.path, hours, pin }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'HTTP ' + res.status);
      $('smForm').style.display = 'none';
      $('smResult').style.display = '';
      $('smUrl').value = linkUrl(data);
      $('smPinOut').innerHTML = data.pin ? `🔑 Mật khẩu: <b>${esc(data.pin)}</b>` : '🔓 Không cần mật khẩu';
      $('smQr').innerHTML = qrImg(linkUrl(data));
      let note = `Hết hạn lúc ${fmtDate(data.expires_at)}. Người nhận chỉ xem và tải về được, không tải lên.`;
      if (/^(localhost|127\.|\[::1\])/.test(location.host))
        note += ' ⚠️ Bạn đang mở bằng localhost — hãy đổi phần đầu link thành địa chỉ IP mạng LAN trước khi gửi.';
      $('smNote').textContent = note;
    } catch (e) {
      toast('Lỗi: ' + e.message);
    } finally {
      btn.disabled = false;
    }
  };
  $('smCopy').onclick = async () => {
    toast(await copyText($('smUrl').value) ? 'Đã chép link' : 'Không chép được — hãy giữ để chép thủ công');
  };

  async function loadLinks() {
    const list = $('lkList');
    try {
      const res = await fetch('/__api/links');
      if (res.status === 401) { location.href = '/__login'; return; }
      const links = await res.json();
      if (!links.length) { list.innerHTML = '<div class="state-msg" style="padding:28px">Chưa có link nào.</div>'; return; }
      list.innerHTML = links.map((l) => `
        <div class="lk-item${l.expired ? ' dead' : ''}" data-id="${l.id}" data-token="${esc(l.token)}">
          <div class="lk-top"><span>${l.kind === 'dir' ? '📂' : '📄'}</span><span class="lk-name">${esc(l.name)}</span></div>
          <div class="lk-meta">
            ${l.pin ? '🔑 ' + esc(l.pin) : '🔓 không mật khẩu'} ·
            ${l.expired ? 'đã hết hạn' : 'còn ' + fmtLeft(l.expires_at)} ·
            ${l.views} lượt mở${l.locked ? ' · 🔒 bị khóa (nhập sai nhiều lần)' : ''}
          </div>
          <div class="lk-acts">
            ${l.expired ? '' : '<button class="v-btn" data-act="copy">⧉ Chép link</button><button class="v-btn" data-act="qr">▦ QR</button>'}
            <button class="v-btn danger" data-act="del">✕ Xóa</button>
          </div>
        </div>`).join('');
    } catch (e) {
      list.innerHTML = `<div class="state-msg" style="padding:28px">Lỗi: ${esc(e.message)}</div>`;
    }
  }

  $('linksBtn').onclick = () => { $('lkList').innerHTML = LOADER; openModal('linksModal'); loadLinks(); };
  $('lkList').addEventListener('click', async (e) => {
    const b = e.target.closest('[data-act]');
    const item = e.target.closest('.lk-item');
    if (!b || !item) return;
    if (b.dataset.act === 'copy') {
      toast(await copyText(linkUrl({ token: item.dataset.token })) ? 'Đã chép link' : 'Không chép được');
    } else if (b.dataset.act === 'qr') {
      showQr(linkUrl({ token: item.dataset.token }));
    } else if (b.dataset.act === 'del') {
      if (!confirm('Xóa link này? Người đang giữ link sẽ không vào được nữa.')) return;
      await fetch('/__api/links/' + item.dataset.id, { method: 'DELETE' });
      toast('Đã xóa link');
      loadLinks();
    }
  });

  // ---------------- Upload (parallel streaming, max throughput) ----------------
  (function () {
    const CONCURRENCY = 4; // parallel connections to saturate the link
    const fileInput = $('fileInput');
    const overlay   = $('dropOverlay');
    const panel     = $('uploadPanel');
    const listEl    = $('upList');
    const titleEl   = $('upTitle');
    const speedEl   = $('upSpeed');
    const dropDest  = $('dropDest');

    let jobs = [], queue = [], active = 0;
    let speedTimer = null, lastBytes = 0, lastTime = 0, emaSpeed = 0;

    const fmt = (b) => {
      if (!b || b < 0) return '0 B';
      const u = ['B','KB','MB','GB','TB']; let i = 0, v = b;
      while (v >= 1024 && i < 4) { v /= 1024; i++; }
      return v.toFixed(i > 0 ? 1 : 0) + ' ' + u[i];
    };
    const totalLoaded = () => jobs.reduce((s, j) => s + j.loaded, 0);
    const doneCount   = () => jobs.filter(j => j.status === 'done').length;
    const errCount    = () => jobs.filter(j => j.status === 'err').length;

    function startSpeedTimer() {
      lastBytes = totalLoaded(); lastTime = performance.now(); emaSpeed = 0;
      speedTimer = setInterval(() => {
        const now = performance.now(), cur = totalLoaded(), dt = (now - lastTime) / 1000;
        if (dt > 0) {
          const inst = (cur - lastBytes) / dt;
          emaSpeed = emaSpeed ? emaSpeed * 0.7 + inst * 0.3 : inst;
          speedEl.textContent = fmt(emaSpeed) + '/s';
        }
        lastBytes = cur; lastTime = now;
      }, 400);
    }
    const stopSpeedTimer = () => { if (speedTimer) { clearInterval(speedTimer); speedTimer = null; } };

    function updateHeader() {
      const d = doneCount(), e = errCount(), n = jobs.length;
      if (d + e >= n) {
        stopSpeedTimer(); speedEl.textContent = '';
        titleEl.textContent = e ? `Xong ${d}/${n} · ${e} lỗi` : `✓ Hoàn tất ${d} file`;
        loadFiles(currentPath); // refresh listing once the batch is done
        if (!e) setTimeout(() => {
          if (doneCount() + errCount() >= jobs.length) panel.classList.remove('show');
        }, 4000);
      } else {
        titleEl.textContent = `Đang tải ${d}/${n}…`;
      }
    }

    function collectFiles(dt) {
      const out = [];
      if (dt.items && dt.items.length) {
        for (const it of dt.items) {
          if (it.kind !== 'file') continue;
          const entry = it.webkitGetAsEntry ? it.webkitGetAsEntry() : null;
          if (entry && entry.isDirectory) continue; // skip dropped folders
          const f = it.getAsFile();
          if (f) out.push(f);
        }
        if (out.length) return out;
      }
      return Array.from(dt.files || []);
    }

    function addFiles(files) {
      files = Array.from(files || []);
      if (!files.length) return;
      if (!panel.classList.contains('show')) { jobs = []; queue = []; listEl.innerHTML = ''; }
      panel.classList.add('show');
      const targetRoot = currentRoot, targetPath = currentPath;
      files.forEach((file) => {
        const row = document.createElement('div');
        row.className = 'up-item';
        row.innerHTML =
          `<div class="row1"><span class="nm">${esc(file.name)}</span><span class="pct">0%</span></div>` +
          `<div class="bar"><i></i></div>`;
        listEl.appendChild(row);
        const job = {
          file, root: targetRoot, path: targetPath, row,
          bar: row.querySelector('i'), pctEl: row.querySelector('.pct'),
          loaded: 0, total: file.size || 1, status: 'queued',
        };
        jobs.push(job); queue.push(job);
      });
      updateHeader();
      if (!speedTimer) startSpeedTimer();
      pump();
    }

    function pump() {
      while (active < CONCURRENCY && queue.length) uploadOne(queue.shift());
    }

    function uploadOne(job) {
      active++; job.status = 'up';
      const xhr = new XMLHttpRequest();
      const url = '/__api/upload?root=' + job.root +
                  '&path=' + encodeURIComponent(job.path) +
                  '&name=' + encodeURIComponent(job.file.name);
      xhr.open('PUT', url);
      xhr.upload.onprogress = (e) => {
        if (e.lengthComputable) {
          job.loaded = e.loaded; job.total = e.total;
          const p = Math.round((e.loaded / e.total) * 100);
          job.bar.style.width = p + '%';
          job.pctEl.textContent = p + '%';
        }
      };
      const finish = (ok) => {
        active--;
        if (ok) { job.status = 'done'; job.loaded = job.total; job.bar.style.width = '100%'; job.pctEl.textContent = '✓'; job.row.classList.add('done'); }
        else    { job.status = 'err';  job.row.classList.add('err'); job.pctEl.textContent = '✕'; }
        updateHeader(); pump();
      };
      xhr.onload  = () => finish(xhr.status >= 200 && xhr.status < 300);
      xhr.onerror = () => finish(false);
      xhr.send(job.file);
    }

    fileInput.addEventListener('change', () => { addFiles(fileInput.files); fileInput.value = ''; });
    $('upClose').addEventListener('click', () => panel.classList.remove('show'));

    // Drag & drop anywhere on the page (only where uploads are allowed)
    let depth = 0;
    const hasFiles = (e) => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
    window.addEventListener('dragenter', (e) => {
      if (!hasFiles(e) || !allowUpload) return;
      e.preventDefault(); depth++;
      dropDest.textContent = '// vào: ' + rootName() + (currentPath === '/' ? '' : currentPath);
      overlay.classList.add('show');
    });
    window.addEventListener('dragover', (e) => { if (hasFiles(e)) e.preventDefault(); });
    window.addEventListener('dragleave', (e) => {
      if (!hasFiles(e) || !allowUpload) return; depth--;
      if (depth <= 0) { depth = 0; overlay.classList.remove('show'); }
    });
    window.addEventListener('drop', (e) => {
      if (!hasFiles(e)) return;
      e.preventDefault(); depth = 0; overlay.classList.remove('show');
      if (!allowUpload) { toast('Thư mục này chỉ cho xem, không tải lên được'); return; }
      addFiles(collectFiles(e.dataTransfer));
    });
  })();

  // ---------------- Start ----------------
  (async function init() {
    if (SHARE) {
      // Recipients only get "download as ZIP", and only for a shared folder.
      ['shareHere', 'linksBtn', 'logoutBtn', 'zipHere'].forEach((id) => { $(id).style.display = 'none'; });
      $('title').textContent = 'Link chia sẻ';
      $('subtitle').textContent = '// chỉ xem & tải về';
      try {
        const res = await fetch(SHARE_BASE + '/__api/info');
        if (res.status === 401) { location.reload(); return; }
        const info = await res.json();
        if (res.ok) {
          shareInfo = info;
          if (info.kind === 'dir') $('zipHere').style.display = '';
          document.title = info.name + ' · namsv';
          $('title').textContent = info.name;
          $('subtitle').textContent = `// link chia sẻ · chỉ xem & tải về · hết hạn ${fmtDate(info.expires_at)}`;
        }
      } catch (e) {}
    } else {
      await loadRoots();
    }
    route();
  })();
</script>
