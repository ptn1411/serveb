[package]
name = "namsv"
version = "1.1.0"
description = "namsv - local file bridge server with a built-in browser UI"
authors = ["ptn1411"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "fs"] }
axum = "0.7"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
futures-util = "0.3"
socket2 = "0.5"
rand = "0.8"
local-ip-address = "0.6"
# SQLite compiled in (no system library needed) — public folders, share links, activity log.
rusqlite = { version = "0.31", features = ["bundled"] }
# QR codes (SVG) for the LAN address and share links.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# "Delete" from the phone moves items to the Windows Recycle Bin.
trash = "5"
# Folder → ZIP download, streamed and uncompressed ("stored") so it is fast.
zip = { version = "8", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
percent-encoding = "2"
# Photo-grid thumbnails (pure-Rust decoders; HEIC/AVIF are not supported).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Image decoding is ~10x slower unoptimised, which makes thumbnails crawl under
# `cargo tauri dev`. Optimise just the decoder crates in dev builds (release
# builds are fully optimised anyway).
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.zune-core]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.image-webp]
opt-level = 3
[profile.dev.package.gif]
opt-level = 3
[profile.dev.package.weezl]
opt-level = 3
[profile.dev.package.moxcms]
opt-level = 3
