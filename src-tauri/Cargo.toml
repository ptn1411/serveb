[package]
name = "namsv"
version = "1.1.0"
description = "namsv - local file bridge server with a built-in browser UI"
authors = ["ptn1411"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "fs"] }
axum = "0.7"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
futures-util = "0.3"
socket2 = "0.5"
rand = "0.8"
local-ip-address = "0.6"
# SQLite compiled in (no system library needed) — public folders, share links, activity log.
rusqlite = { version = "0.31", features = ["bundled"] }
# QR codes (SVG) for the LAN address and share links.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# "Delete" from the phone moves items to the Windows Recycle Bin.
trash = "5"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
